name: gen-keystore
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate keystore
        run: |
          PW=$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 24)
          keytool -genkeypair -v -keystore dnfda-release.jks -alias dnfda \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Dnfda, OU=Dnfda, O=Dnfda, L=CN, ST=CN, C=CN"
          base64 -w0 dnfda-release.jks > keystore.b64
          printf '%s\n' "$PW" > password.txt
          echo "alias: dnfda"
          wc -c keystore.b64 password.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dnfda-keystore
          path: |
            dnfda-release.jks
            keystore.b64
            password.txt
