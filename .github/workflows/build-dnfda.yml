name: build-dnfda
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Android SDK licenses
        run: |
          echo "sdk root: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | sdkmanager --licenses > /dev/null || true
      - name: fetch prebuilt native libs
        run: bash native/prebuilt.sh fetch
      - run: bash js/build-engine.sh
      - name: rename to Dnfda
        run: |
          R=app/src/main/res
          sed -i 's|>DSH<|>Dnfda<|' $R/values/strings.xml $R/values-en/strings.xml
          sed -i 's|问 DSH|问 Dnfda|; s|Ask DSH|Ask Dnfda|' $R/values/strings.xml $R/values-en/strings.xml
          sed -i 's|安装为 DSH 扩展|安装为 Dnfda 扩展|' $R/values/strings_extensions.xml
          sed -i 's|DSH 输入法|Dnfda 输入法|' $R/values/strings_reliability.xml
      - name: add network gate
        run: |
          cp ci/GateActivity.kt app/src/main/java/io/github/jackwener/dsh/GateActivity.kt
          node ci/patch-manifest.js
      - name: decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: build signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Pdsh.signing.storeFile="$RUNNER_TEMP/release.jks" \
            -Pdsh.signing.storePassword="$KEYSTORE_PASSWORD" \
            -Pdsh.signing.keyAlias=dnfda \
            -Pdsh.signing.keyPassword="$KEYSTORE_PASSWORD"
      - name: stage apk
        run: cp app/build/outputs/apk/release/*.apk Dnfda-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dnfda-release
          path: Dnfda-arm64.apk
      - name: publish release
        run: |
          TAG=dnfda-latest
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Dnfda $(date -u +%Y-%m-%d)" \
            --notes "Dnfda（DSH-Android 改名版）：显示名 Dnfda、启动时网络验证、正式签名（可直接覆盖升级）。arm64，Android 10+。" \
            Dnfda-arm64.apk
